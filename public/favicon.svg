<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701515" />
      <stop offset="100%" stop-color="#380808" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="50%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFD700" />
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Circular Badge Background -->
  <circle cx="32" cy="32" r="30" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="3"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#FFD700" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Center Firework Sparkles & Rocket Flame -->
  <g transform="translate(32, 32)">
    <!-- Diagonal Rocket / Sparkler -->
    <path d="M-8,14 L8,-2 L14,-8 L8,-14 L2,-8 L-14,8 Z" fill="url(#goldGrad)"/>
    <!-- Flame tip -->
    <path d="M8,-14 Q14,-22 18,-24 Q14,-16 14,-8 Z" fill="#FF4500"/>
    <path d="M9,-13 Q13,-19 15,-20 Q12,-15 13,-9 Z" fill="#FFD700"/>
    
    <!-- Radiating Sparkle Bursts -->
    <circle cx="-16" cy="-12" r="2.5" fill="#FFD700"/>
    <circle cx="16" cy="14" r="2" fill="#FFD700"/>
    <circle cx="-12" cy="18" r="1.8" fill="#FFE066"/>
    <circle cx="18" cy="-6" r="2.2" fill="#FFE066"/>
    <circle cx="-2" cy="-18" r="2" fill="#FFFFFF"/>
    
    <!-- Central Glow -->
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>